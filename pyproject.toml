[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetsense"
version = "1.0.0"
description = "NYC Taxi Analytics & Operations Dashboard — Phase 1: Data Foundation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "duckdb>=1.0.0",
    "pandera[polars]>=0.20.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
fleetsense = "fleetsense.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/fleetsense"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "detect-secrets>=1.5.0",
]
